# Live lane: manager-prompt versions compared on fixture-ledger evidence. Run via `npm run live` (tests/acceptance/promptfoo/main.ts),
# which starts the fixture and both server profiles and exports the environment the provider needs.
description: Mia live acceptance scenarios (on the runtime `npm run live -- --runtime` picks)
prompts:
  - "{{scenario}}"
providers:
  - id: file://provider.ts
    label: mia-live
defaultTest:
  assert:
    - type: javascript
      value: file://assert.ts
tests:
  - description: allowed
    vars: { scenario: allowed }
  - description: approve-reject
    vars: { scenario: approve-reject }
  - description: denied
    vars: { scenario: denied }
  - description: never-blocks
    vars: { scenario: never-blocks }
  - description: interrupt-task
    vars: { scenario: interrupt-task }
  - description: interrupt-all
    vars: { scenario: interrupt-all }
  - description: allow-policy-no-prompt
    vars: { scenario: allow-policy-no-prompt }
  - description: artifact-export
    vars: { scenario: artifact-export }
  - description: set-and-deduct
    vars: { scenario: set-and-deduct }
evaluateOptions:
  maxConcurrency: 1
